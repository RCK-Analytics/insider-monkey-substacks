name: Scrape Reddit RSS

on:
  schedule:
    # Runs daily at 3:15 AM UTC = 8:45 AM IST  (same slot as your Substack scraper)
    - cron: "15 3 * * *"
  workflow_dispatch:   # manual trigger from Actions tab anytime

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to git push data/articles.json back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        run: python scraper/scrape_reddit.py

      - name: Commit & push if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reddit_articles.json
          # Only commit if something actually changed
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "chore: reddit RSS update $(date -u +'%Y-%m-%d %H:%M UTC')" && git push
