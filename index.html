<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Substack Feed - RCK Analytics</title>
  <link rel="icon" type="image/jpeg" href="favicon.jpg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f6fa;
      color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .header {
      background: #12192B;
      color: white;
      padding: 14px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,0.4);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: white;
      text-decoration: none;
    }

    .logo span { color: #4f8ef7; }

    .vdivider {
      width: 1px;
      height: 22px;
      background: rgba(255,255,255,0.2);
    }

    .header-subtitle {
      font-size: 14px;
      color: rgba(255,255,255,0.6);
    }

    .header-right { text-align: right; }

    .stats-badge {
      background: rgba(79,142,247,0.15);
      border: 1px solid rgba(79,142,247,0.35);
      color: #4f8ef7;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
    }

    .last-updated {
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      margin-top: 4px;
    }

    /* ── Page tabs (Substack / Reddit) ── */
    .page-tabs {
      background: #12192B;
      padding: 0 32px;
      display: flex;
      gap: 4px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .page-tab {
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.45);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 7px;
      user-select: none;
    }

    .page-tab:hover { color: rgba(255,255,255,0.8); }

    .page-tab.active {
      color: white;
      border-bottom-color: #4f8ef7;
    }

    .page-tab .tab-icon { font-size: 15px; }

    /* ── Controls ── */
    .controls {
      background: white;
      padding: 14px 32px;
      border-bottom: 1px solid #e8eaed;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .search-wrap {
      flex: 1;
      min-width: 220px;
      position: relative;
    }

    .search-wrap input {
      width: 100%;
      padding: 9px 12px 9px 36px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      color: #1a1a2e;
      transition: border 0.2s;
    }

    .search-wrap input:focus { border-color: #4f8ef7; }

    .search-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: #9aa0a6;
      font-size: 14px;
      pointer-events: none;
    }

    .date-filters { display: flex; gap: 6px; }

    .date-btn {
      padding: 8px 13px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      background: white;
      font-size: 13px;
      cursor: pointer;
      color: #5f6368;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .date-btn:hover { border-color: #4f8ef7; color: #4f8ef7; }

    .date-btn.active {
      background: #12192B;
      border-color: #12192B;
      color: white;
    }

    .source-select {
      padding: 9px 12px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      color: #1a1a2e;
      cursor: pointer;
      min-width: 190px;
      transition: border 0.2s;
      background: white;
    }

    .source-select:focus { border-color: #4f8ef7; }

    /* ── Results bar ── */
    .results-bar {
      padding: 9px 32px;
      font-size: 13px;
      color: #5f6368;
      background: #f5f6fa;
      border-bottom: 1px solid #e8eaed;
    }

    .results-bar b { color: #12192B; }

    /* ── Table ── */
    .table-wrap {
      padding: 24px 32px;
      flex: 1;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 6px rgba(0,0,0,0.07);
    }

    thead { background: #12192B; }

    thead th {
      padding: 13px 16px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.75);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    thead th:hover { color: white; }
    thead th.sorted { color: white; }

    tbody tr {
      border-bottom: 1px solid #f0f2f5;
      transition: background 0.1s;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f8f9ff; }

    /* visited row styling */
    tbody tr.visited-row {
      background: #f9f9f9;
    }

    tbody tr.visited-row td.col-date,
    tbody tr.visited-row td.col-title a {
      color: #9aa0a6;
    }

    tbody tr.visited-row td.col-title a {
      text-decoration: none;
    }

    tbody tr.visited-row:hover {
      background: #f3f4f8;
    }

    tbody td {
      padding: 11px 16px;
      font-size: 14px;
      vertical-align: middle;
    }

    .col-date {
      width: 145px;
      color: #6b7280;
      font-size: 13px;
      white-space: nowrap;
    }

    .col-source { width: 190px; }

    .tag {
      display: inline-block;
      background: #eef2ff;
      color: #3b5bdb;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
      max-width: 175px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Reddit tag colour */
    .tag.reddit-tag {
      background: #fff0eb;
      color: #c0440a;
    }

    .col-title a {
      color: #12192B;
      text-decoration: none;
      font-weight: 500;
      line-height: 1.4;
    }

    .col-title a:hover {
      color: #4f8ef7;
      text-decoration: underline;
    }

    .new-badge {
      display: inline-block;
      background: #dcfce7;
      color: #15803d;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 8px;
      vertical-align: middle;
      letter-spacing: 0.3px;
    }

    /* ── Loading / empty ── */
    .loading, .empty-state {
      text-align: center;
      padding: 72px 20px;
      color: #6b7280;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid #e5e7eb;
      border-top-color: #4f8ef7;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state h3 {
      font-size: 17px;
      color: #374151;
      margin-bottom: 6px;
    }

    /* ── Footer ── */
    .footer {
      background: #12192B;
      color: rgba(255,255,255,0.5);
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 13px;
      margin-top: auto;
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .footer-logo {
      font-weight: 700;
      color: white;
      font-size: 14px;
      text-decoration: none;
    }

    .footer-logo span { color: #4f8ef7; }

    .footer-sep { color: rgba(255,255,255,0.2); }

    .footer-links {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .footer-links a {
      color: rgba(255,255,255,0.5);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.15s;
    }

    .footer-links a:hover { color: white; }

    .footer-right {
      font-size: 12px;
      color: rgba(255,255,255,0.3);
    }
  </style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <a href="https://rckanalytics.com" class="logo">RCK<span>.</span></a>
    <div class="vdivider"></div>
    <div class="header-subtitle" id="header-subtitle">Substack Intelligence Feed</div>
  </div>
  <div class="header-right">
    <div class="stats-badge" id="stats-badge">Loading...</div>
    <div class="last-updated" id="last-updated"></div>
  </div>
</div>

<!-- Page Tabs -->
<div class="page-tabs">
  <div class="page-tab active" id="tab-substack" onclick="switchPage('substack')">
    <span class="tab-icon">📰</span> Substack
  </div>
  <div class="page-tab" id="tab-reddit" onclick="switchPage('reddit')">
    <span class="tab-icon">🟠</span> Reddit
  </div>
</div>

<!-- Controls -->
<div class="controls">
  <div class="search-wrap">
    <span class="search-icon">&#128269;</span>
    <input type="text" id="search-input" placeholder="Search title or source..." oninput="applyFilters()">
  </div>
  <div class="date-filters">
    <button class="date-btn" onclick="setDateFilter(1, event)">Today</button>
    <button class="date-btn active" onclick="setDateFilter(7, event)">7 Days</button>
    <button class="date-btn" onclick="setDateFilter(14, event)">14 Days</button>
    <button class="date-btn" onclick="setDateFilter(30, event)">30 Days</button>
    <button class="date-btn" onclick="setDateFilter(0, event)">All Time</button>
  </div>
  <select class="source-select" id="source-filter" onchange="applyFilters()">
    <option value="">All Sources</option>
  </select>
</div>

<!-- Results bar -->
<div class="results-bar" id="results-bar">Loading articles...</div>

<!-- Table -->
<div class="table-wrap">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>Fetching latest articles...</p>
  </div>

  <table id="articles-table" style="display:none">
    <thead>
      <tr>
        <th class="sorted" onclick="sortBy('pubdate')" data-col="pubdate">Date &#9660;</th>
        <th onclick="sortBy('substack')" data-col="substack">Source &#8597;</th>
        <th>Title</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>

  <div class="empty-state" id="empty-state" style="display:none">
    <h3>No articles found</h3>
    <p>Try adjusting your search or date range.</p>
  </div>
</div>

<!-- Footer -->
<footer class="footer">
  <div class="footer-left">
    <a href="https://rckanalytics.com" class="footer-logo">RCK<span>.</span></a>
    <span class="footer-sep">|</span>
    <span id="footer-label">Substack Intelligence Feed</span>
  </div>
  <div class="footer-links">
    <a href="https://rckanalytics.com" target="_blank">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      rckanalytics.com
    </a>
    <a href="https://linkedin.com/company/rck-analytics" target="_blank">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
      LinkedIn
    </a>
  </div>
  <div class="footer-right" id="footer-updated">Updated daily at 9:00 AM IST</div>
</footer>

<script>
  // ── State ──────────────────────────────────────────────────────────────────
  let substackArticles = [];
  let redditArticles   = [];
  let activePage       = 'substack';   // 'substack' | 'reddit'
  let activeDateFilter = 7;
  let sortCol  = 'pubdate';
  let sortDir  = -1;

  // visited links — persisted in localStorage so it survives refresh
  const VISITED_KEY = 'rck_visited_links';
  let visitedLinks  = new Set(JSON.parse(localStorage.getItem(VISITED_KEY) || '[]'));

  function markVisited(link) {
    visitedLinks.add(link);
    localStorage.setItem(VISITED_KEY, JSON.stringify([...visitedLinks]));
  }

  // ── Load data ──────────────────────────────────────────────────────────────
  async function loadAll() {
    try {
      // Load both feeds in parallel
      const [subRes, redRes] = await Promise.allSettled([
        fetch('./data/articles.json?t=' + Date.now()),
        fetch('./data/reddit_articles.json?t=' + Date.now())
      ]);

      if (subRes.status === 'fulfilled' && subRes.value.ok) {
        substackArticles = await subRes.value.json();
      }
      if (redRes.status === 'fulfilled' && redRes.value.ok) {
        redditArticles = await redRes.value.json();
      }

      document.getElementById('loading').style.display = 'none';
      renderPage();

    } catch (e) {
      document.getElementById('loading').innerHTML =
        '<p>Could not load data — make sure articles.json exists in data/ folder.</p>';
    }
  }

  // ── Tab switching ──────────────────────────────────────────────────────────
  function switchPage(page) {
    activePage = page;
    activeDateFilter = 7;
    sortCol = 'pubdate';
    sortDir = -1;

    // reset date buttons
    document.querySelectorAll('.date-btn').forEach((b, i) => {
      b.classList.toggle('active', i === 1); // "7 Days" is index 1
    });

    // reset search
    document.getElementById('search-input').value = '';

    // update tabs
    document.getElementById('tab-substack').classList.toggle('active', page === 'substack');
    document.getElementById('tab-reddit').classList.toggle('active', page === 'reddit');

    // update subtitle + footer label
    const label = page === 'substack' ? 'Substack Intelligence Feed' : 'Reddit Stocks Feed';
    document.getElementById('header-subtitle').textContent = label;
    document.getElementById('footer-label').textContent = label;

    renderPage();
  }

  // ── Render source dropdown + table for active page ─────────────────────────
  function renderPage() {
    const articles = activePage === 'substack' ? substackArticles : redditArticles;
    const dropdownLabel = activePage === 'substack' ? 'All Substacks' : 'All Subreddits';

    // rebuild source dropdown
    const sel = document.getElementById('source-filter');
    sel.innerHTML = `<option value="">${dropdownLabel}</option>`;
    const sources = [...new Set(articles.map(a => a.substack))].sort();
    sources.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s; opt.textContent = s;
      sel.appendChild(opt);
    });

    // update last-updated from latest pubdate
    const dates = articles.map(a => new Date(a.pubdate)).filter(d => !isNaN(d));
    if (dates.length) {
      const latest = new Date(Math.max(...dates));
      document.getElementById('last-updated').textContent =
        'Data up to ' + latest.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    applyFilters();
  }

  // ── Filters + render table ─────────────────────────────────────────────────
  function setDateFilter(days, event) {
    activeDateFilter = days;
    document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    applyFilters();
  }

  function applyFilters() {
    const articles = activePage === 'substack' ? substackArticles : redditArticles;
    const search   = document.getElementById('search-input').value.toLowerCase().trim();
    const srcVal   = document.getElementById('source-filter').value;
    const now      = new Date();
    const cutoffNew = new Date(now); cutoffNew.setDate(cutoffNew.getDate() - 1);

    let filtered = articles.filter(a => {
      if (activeDateFilter > 0) {
        const pub = new Date(a.pubdate);
        if ((now - pub) / 86400000 > activeDateFilter) return false;
      }
      if (srcVal && a.substack !== srcVal) return false;
      if (search) {
        const inTitle = (a.title   || '').toLowerCase().includes(search);
        const inSub   = (a.substack|| '').toLowerCase().includes(search);
        if (!inTitle && !inSub) return false;
      }
      return true;
    });

    filtered.sort((a, b) => {
      let va = a[sortCol] || '', vb = b[sortCol] || '';
      if (sortCol === 'pubdate') { va = new Date(va); vb = new Date(vb); }
      if (va < vb) return sortDir;
      if (va > vb) return -sortDir;
      return 0;
    });

    const tbody = document.getElementById('table-body');
    const table = document.getElementById('articles-table');
    const empty = document.getElementById('empty-state');

    if (filtered.length === 0) {
      table.style.display = 'none';
      empty.style.display = 'block';
    } else {
      table.style.display = 'table';
      empty.style.display = 'none';

      tbody.innerHTML = filtered.map(a => {
        const pub    = new Date(a.pubdate);
        const isNew  = pub >= cutoffNew;
        const isVisited = visitedLinks.has(a.link);

        // Format date — show time too if pubdate has it (reddit does, substack doesn't)
        let dateStr;
        if (isNaN(pub)) {
          dateStr = a.pubdate;
        } else if (a.pubdate && a.pubdate.includes(' ')) {
          // has time component e.g. "2026-08-19 14:35"
          dateStr = pub.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })
                  + ' · ' + pub.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
        } else {
          dateStr = pub.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        const safeTitle    = (a.title   || '').replace(/</g, '&lt;');
        const safeSubstack = (a.substack|| '').replace(/</g, '&lt;');
        const isReddit     = activePage === 'reddit';
        const tagClass     = isReddit ? 'tag reddit-tag' : 'tag';

        return `<tr class="${isVisited ? 'visited-row' : ''}" data-link="${a.link}">
          <td class="col-date">${dateStr}</td>
          <td class="col-source"><span class="${tagClass}" title="${safeSubstack}">${safeSubstack}</span></td>
          <td class="col-title">
            <a href="${a.link}" target="_blank" rel="noopener noreferrer"
               onclick="markVisited('${a.link.replace(/'/g, "\\'")}'); this.closest('tr').classList.add('visited-row');">
              ${safeTitle}
            </a>
            ${isNew ? '<span class="new-badge">NEW</span>' : ''}
          </td>
        </tr>`;
      }).join('');
    }

    const srcCount = new Set(filtered.map(a => a.substack)).size;
    const srcWord  = activePage === 'substack' ? 'substacks' : 'subreddits';
    document.getElementById('stats-badge').textContent =
      filtered.length + ' articles · ' + srcCount + ' ' + srcWord;
    document.getElementById('results-bar').innerHTML =
      'Showing <b>' + filtered.length + ' articles</b> across <b>' + srcCount + ' ' + srcWord + '</b>';
  }

  function sortBy(col) {
    if (sortCol === col) { sortDir *= -1; }
    else { sortCol = col; sortDir = col === 'pubdate' ? -1 : 1; }
    document.querySelectorAll('thead th').forEach(th => {
      th.classList.remove('sorted');
      if (th.dataset.col === col) {
        th.classList.add('sorted');
        th.innerHTML = (col === 'pubdate' ? 'Date' : 'Source') +
          ' ' + (sortDir === -1 ? '&#9660;' : '&#9650;');
        th.setAttribute('onclick', `sortBy('${col}')`);
      }
    });
    applyFilters();
  }

  loadAll();
</script>
</body>
</html>
